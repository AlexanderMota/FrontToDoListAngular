<div class="login-box">
  <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
    
    <h2>Iniciar sesión</h2>

    <!-- Email -->
    <mat-form-field appearance="outline" class="full-width"
      subscriptSizing="dynamic">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" type="email" required placeholder="tuemail@dominio.com" />
      <mat-error *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
        El correo es obligatorio y debe ser válido
      </mat-error>
    </mat-form-field>

    <!-- Password -->
    <mat-form-field appearance="outline" class="full-width"
      subscriptSizing="dynamic">
      <mat-label>Password</mat-label>
      <input matInput formControlName="password" type="password" required placeholder="_tucontraseña123_" />
      <mat-error *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        La contraseña es obligatoria y debe tener al menos 6 caracteres
      </mat-error>
    </mat-form-field>
    <div
      class="error-message"
      *ngIf="errorMessage"
      role="alert">

      {{ errorMessage }} 
      <button
        *ngIf="reverify"
        type="button"
        class="boton_link link_resend"
        [disabled]="resendingVerification"
        (click)="resendVerificationEmail()">
        {{ resendingVerification
            ? 'Enviando correo...'
            : 'Volver a enviar correo de verificación.' }}
      </button>
    </div>
    
    <div
      class="success-message"
      *ngIf="successMessage"
      role="status">

      {{ successMessage }}

    </div>
    <div
      class="actions">

      <div class="remember-forgot">
    
        <!-- Recordarme -->
        <mat-checkbox formControlName="rememberMe">Mantener sesión iniciada</mat-checkbox>
        <a class="boton_link link_forgot" (click)="onForgotPassword()">¿Has olvidado tu contraseña?</a>
      </div>

      <!-- Botón de Enviar -->
      <button
      mat-raised-button
      color="primary"
      type="submit"
      [disabled]="loginForm.invalid || loading">

      {{ loading ? 'Accediendo...' : 'Acceder' }}

    </button>

    </div>
  </form>
</div>
