<div class="login-box">
  <form [formGroup]="loginForm" (ngSubmit)="onForgotPassword()">
    
    <h2>Recuperar contraseña</h2>

    <!-- Email -->
    <mat-form-field appearance="outline" class="full-width"
      subscriptSizing="dynamic">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" type="email" required placeholder="tuemail@dominio.com" />
      <mat-error *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
        El correo es obligatorio y debe ser válido
      </mat-error>
    </mat-form-field>


    <div
      class="error-message"
      *ngIf="errorMessage"
      role="alert">

      {{ errorMessage }}

    </div>
    <div
      class="success-message"
      *ngIf="successMessage"
      role="status">

      {{ successMessage }}

    </div>
      

    <button
      class="actions"
      mat-raised-button
      color="primary"
      type="submit"
      [disabled]="loginForm.invalid || loading">

      {{ loading ? 'Enviando...' : 'Enviar correo de recuperación' }}

    </button>

    <a (click)="toggleFormLogIn()">Volver al login</a>

  </form>
</div>
