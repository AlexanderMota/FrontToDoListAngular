<div class="task-card" (click)="abrirTarea()">

  <div class="task-header">

    <h3>{{ tarea.name }}</h3>

    <span class="priority"
      [ngClass]="tarea.priority">
      {{ getPriorityLabel(tarea.priority) }}
    </span>

  </div>
  

   
   <div class="description_container" >

  <p class="description"
  [class.expanded]="expanded">
    {{ tarea.description }}
  </p>
<button
  class="expand-btn"
  [class.expanded]="expanded"
  (click)="toggleDescription($event)">
  {{ expanded ? '▲' : '▼' }}
</button>
   </div>



  <div class="task-footer">

    <span 
      class="status" 
      [ngClass]="tarea.status">
      {{ getStatusLabel(tarea.status) }}
    </span>

    <span class="date">
      {{ tarea.updated_at | date:'dd/MM/yyyy' }}
    </span>

  </div>

</div>
