
<div class="tasks-container">
  <div class="tasks-header">
    <div>
      <h1>Mis tareas</h1>
      <p>Gestiona tus tareas y mantén el control de tu trabajo.</p>
    </div>

    <button
      class="btn-new-task"
      (click)="newTask()">
      <span>+</span>
      Nueva tarea
    </button>
  </div>

  <div class="tasks-grid">
    <app-tarea-card
      *ngFor="let task of tasks"
      [task]="task">
    </app-tarea-card>
  </div>
</div>
