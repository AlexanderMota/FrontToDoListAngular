
<div class="tasks-container">
  <div class="tasks-header"
    [class.primer]="myTasks">
    <div>
      <h1>{{title}}</h1>
      <p>{{paragraph}}</p>
    </div>

    <button
      *ngIf="myTasks"
      class="btn-new-task"
      (click)="newTask()">
      <span>+</span>
      Nueva tarea
    </button>

  </div>

  <div class="tasks-grid">
    <app-tarea-card
      *ngFor="let task of tasks"
      [task]="task">
    </app-tarea-card>
  </div>
</div>
