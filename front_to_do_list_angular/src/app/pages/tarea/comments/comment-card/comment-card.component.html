
      <div
        class="comentario-card">

        <div class="comentario-header">

          <div class="comentario-usuario">

            <div class="avatar">
              {{ comentario.username.charAt(0).toUpperCase() }}
            </div>

            <span class="username">
              {{ comentario.username }}
            </span>

          </div>

          <span class="fecha">
            {{ comentario.created_at | date:'dd/MM/yyyy HH:mm' }}
          </span>

        </div>

        <div class="comentario-content">
          {{ comentario.content }}
        </div>
