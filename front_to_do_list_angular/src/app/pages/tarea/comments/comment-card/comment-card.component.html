
<div class="comentario-card">

  <div class="comentario-header">

    <div class="comentario-usuario">

      <div class="avatar">
        {{ comentario.username.charAt(0).toUpperCase() }}
      </div>

      <span class="username">
        {{ comentario.username }}
      </span>

    </div>

    <span class="fecha">
      {{ comentario.created_at | date:'dd/MM/yyyy HH:mm' }}
    </span>

  </div>

  <p class="comentario-content">
    {{ comentario.content }}
  </p>


  <div class="menu-container">

    <button
      class="menu-btn"
      (click)="toggleMenu($event)">

      ⋮

    </button>

    <div
      class="comment-menu"
      *ngIf="openedMenu === comentario.comment_id">

      <button (click)="editComment(comentario)"
       *ngIf="comentario.user_id == currentUser">
        ✏ Editar
      </button>

      <button
        class="delete"
        (click)="deleteComment(comentario.comment_id!)"
       *ngIf="comentario.user_id == currentUser">

        🗑 Eliminar

      </button>

      <button
        class="delete"
        (click)="deleteComment(comentario.comment_id!)"
       *ngIf="comentario.user_id != currentUser">

        🗑 Responder

      </button>

    </div>

  </div>

</div>
