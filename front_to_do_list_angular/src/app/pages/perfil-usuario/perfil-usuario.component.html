<div class="profile-container">

  <div class="profile-card">

    <div class="profile-header">

      @if (user.avatar_url) {

        <img
          [src]="user.avatar_url"
          [alt]="user.username"
          [title]="user.username"
          class="avatar">

      } @else {

        <div class="avatar avatar-placeholder">

          {{ user.username?.charAt(0)?.toUpperCase() }}

        </div>

      }

      <div class="profile-title">

        <h1>{{ user.username }}</h1>

        <p>{{ user.email }}</p>

      </div>

    </div>

    <div class="profile-grid">

      <div class="info-card">

        <span class="label">
          Nombre
        </span>

        <span>
          {{ user.name || 'No especificado' }}
        </span>

      </div>

      <div class="info-card">

        <span class="label">
          Apellidos
        </span>

        <span>
          {{ user.lastname || 'No especificado' }}
        </span>

      </div>

      <div class="info-card">

        <span class="label">
          Email
        </span>

        <span>
          {{ user.email }}
        </span>

      </div>

      <div class="info-card">

        <span class="label">
          Rol
        </span>

        <span>
          {{ user.role_id }}
        </span>

      </div>

    </div>

    <div class="profile-actions">

      <button class="btn-primary">
        Editar perfil
      </button>

      <button class="btn-secondary">
        Cambiar contraseña
      </button>

    </div>

  </div>

</div>
